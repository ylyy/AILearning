<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI学习监督系统 - 测试页面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #111827;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
            margin-bottom: 1rem;
        }
        .status {
            font-size: 0.875rem;
            color: #9ca3af;
            margin: 0.25rem 0;
        }
        button {
            background-color: #3b82f6;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            margin: 0.25rem;
        }
        button:hover {
            background-color: #2563eb;
        }
        .success {
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 AI学习监督系统</h1>
        <p>测试页面 - 验证基础功能</p>
        
        <div style="margin-bottom: 1rem;">
            <p class="status success">✅ HTML 正常加载</p>
            <p class="status success">✅ CSS 样式正常</p>
            <p class="status success">✅ 基础布局正常</p>
        </div>
        
        <div>
            <button onclick="testJavaScript()">测试 JavaScript</button>
            <button onclick="window.location.reload()">重新加载</button>
            <button onclick="openViteApp()">打开 Vite 应用</button>
        </div>
        
        <div id="js-test" style="margin-top: 1rem;"></div>
        
        <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb;">
            <h3 style="color: #374151; margin-bottom: 0.5rem;">调试信息</h3>
            <p class="status">当前时间: <span id="current-time"></span></p>
            <p class="status">用户代理: <span id="user-agent"></span></p>
            <p class="status">页面URL: <span id="page-url"></span></p>
        </div>
    </div>

    <script>
        function testJavaScript() {
            const testDiv = document.getElementById('js-test');
            testDiv.innerHTML = '<p class="status success">✅ JavaScript 正常工作!</p>';
            
            // 测试一些基本功能
            setTimeout(() => {
                testDiv.innerHTML += '<p class="status success">✅ 定时器功能正常!</p>';
            }, 1000);
        }
        
        function openViteApp() {
            window.open('http://localhost:5173', '_blank');
        }
        
        function updateDebugInfo() {
            document.getElementById('current-time').textContent = new Date().toLocaleString();
            document.getElementById('user-agent').textContent = navigator.userAgent.substring(0, 50) + '...';
            document.getElementById('page-url').textContent = window.location.href;
        }
        
        // 页面加载完成后更新调试信息
        document.addEventListener('DOMContentLoaded', function() {
            updateDebugInfo();
            setInterval(updateDebugInfo, 1000);
        });
        
        // 自动测试JavaScript
        setTimeout(testJavaScript, 500);
    </script>
</body>
</html>
